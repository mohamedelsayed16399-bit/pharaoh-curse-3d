 if(o.t==='e'){P.evo[o.k]=1;banner('✨ تطور! '+WDEF[o.k].n);ringFx(P.x,P.z,10,0xffffff,.6)}
 else if(o.t==='w'){P.w[o.k]++}
 else{P.p[o.k]++;if(o.k==='hp'){P.mhp+=25;P.hp=Math.min(P.mhp,P.hp+25)}if(o.k==='spd')P.sp*=1.08}
 S.pending--;$('lvl').classList.remove('on');S.state='play';renderWeapons();snd(800,.2,'triangle',.06,1.5)}
function renderWeapons(){let h='';for(const k in P.w)if(P.w[k])h+=`<div class="wi"><b>${WDEF[k].ic}</b>${'●'.repeat(P.w[k])}</div>`;
 for(const k in P.p)if(P.p[k])h+=`<div class="wi"><b>${PDEF[k].ic}</b>${P.p[k]}</div>`;$('wp').innerHTML=h}
let bT=0;const bn=document.createElement('div');bn.style.cssText='position:fixed;top:30%;left:0;right:0;text-align:center;font-size:clamp(22px,5vw,40px);font-weight:bold;color:#ffd35a;text-shadow:0 0 14px #e08a1e,0 2px 4px #000;pointer-events:none;z-index:12;opacity:0;transition:opacity .3s';document.body.appendChild(bn);
function banner(t){bn.textContent=t;bn.style.opacity=1;bT=2.2}
function updFx(dt){
 bT-=dt;if(bT<=0)bn.style.opacity=0;
 for(let i=fxs.length-1;i>=0;i--){const f=fxs[i];f.t-=dt;const k=Math.max(0,f.t/f.T);
  if(f.ring){f.m.scale.setScalar(f.ring*(1-k)+.1);f.m.material.opacity=k}
  else if(!f.line){f.vy-=14*dt;f.m.position.x+=f.vx*dt;f.m.position.y=Math.max(.05,f.m.position.y+f.vy*dt);f.m.position.z+=f.vz*dt;f.m.material.opacity=k}
  if(f.t<=0){scene.remove(f.m);if(f.line)f.m.geometry.dispose();fxs.splice(i,1)}}
 S.shake=Math.max(0,S.shake-dt*2)}

 $('hpb').firstChild.style.width=Math.max(0,P.hp/P.mhp*100)+'%';$('xpb').firstChild.style.width=(P.xp/xpNeed(P.lvl)*100)+'%';
 const t=Math.floor(S.t);$('tm').textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
 $('st').innerHTML=`المستوى ${P.lvl}${S.curse>1?' · لعنة '+S.curse:''}<br>☠ ${S.kills} &nbsp; 🪙 ${S.coins}`;
 const dd=$('dash');dd.classList.toggle('cd',P.dcd>0);dd.textContent=P.dcd>0?P.dcd.toFixed(1):'اندفاع'}
/* ---------- flow ---------- */
function step(dt){
 if(S.state!=='play')return;
 S.t+=dt;director(dt);updatePlayer(dt);updateEnemies(dt);weapons(dt);updateProj(dt);updateEP(dt);updateTele(dt);updatePools(dt);updatePickups(dt);updFx(dt);
 if(S.state==='play'&&S.pending>0){
  if(S.auto){const o=offerUpgrades();if(o.length)pickUp(o[0]);else S.pending--}
  else showLevel()}}
const ACH=[['first','🏆 كسرت اللعنة لأول مرة',x=>x.win],['k1000','☠ قتلت 1000 في جولة واحدة',x=>x.kills>=1000],['t5','⏱ صمدت 5 دقايق',x=>x.t>=300],['l20','⭐ وصلت مستوى 20',x=>x.lvl>=20],['c3','💀 كسرت اللعنة على مستوى 3',x=>x.win&&x.curse>=3],['rich','🪙 جمعت 100 ذهب في جولة',x=>x.coins>=100]];
function checkAch(win){const x={win,kills:S.kills,t:S.t,lvl:P.lvl,curse:S.curse,coins:S.coins},got=[];for(const a of ACH)if(!SAVE.ach[a[0]]&&a[2](x)){SAVE.ach[a[0]]=1;got.push(a[1])}return got}
function end(win){
 S.state='end';S.won=win;
 const mult=(1+.5*(S.curse-1))*(S.daily?1.5:1);let earned=Math.floor((S.coins+Math.floor(S.kills/20)+(win&&!S.endless?100:0))*mult);if(S.endless){earned=Math.max(0,earned-(S.paid||0))}S.paid=(S.paid||0)+earned;if(win&&S.curse>=SAVE.maxCurse&&SAVE.maxCurse<3){SAVE.maxCurse++;S.unlock=1}SAVE.coins+=earned;if(!S.endless)SAVE.runs++;SAVE.kills+=S.kills-(S.counted||0);S.counted=S.kills;if(S.daily){if(SAVE.daily.d!==TODAY)SAVE.daily={d:TODAY,best:0};if(S.t>SAVE.daily.best)SAVE.daily.best=Math.floor(S.t)};if(S.t>SAVE.best)SAVE.best=Math.floor(S.t);if(win&&!S.endless)SAVE.wins++;const gotA=checkAch(win);persist();
 $('et').textContent=S.endless?'♾ انتهى اللانهائي':win?'☀️ طلع الفجر! كسرت اللعنة':'💀 اللعنة أخدتك';$('endless').style.display=(win&&!S.endless)?'inline-block':'none';
 const t=Math.floor(S.t);
 $('es').innerHTML=`صمدت ${Math.floor(t/60)}:${String(t%60).padStart(2,'0')} · المستوى ${P.lvl} · ☠ ${S.kills}<br>الذهب اللي كسبته: 🪙 ${earned}${win?' (+100 مكافأة النصر)':''}`;
 if(gotA.length)$('es').innerHTML+='<br>🎖 إنجاز جديد: '+gotA.join(' · ');if(S.unlock)$('es').innerHTML+='<br>🔓 فتحت مستوى لعنة أعلى!';if(S.curse>1)$('es').innerHTML+=`<br>مضاعف اللعنة ×${1+.5*(S.curse-1)}`;S.shareTxt=`𓂀 لعنة الفرعون: صمدت ${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}، مستوى ${P.lvl}، قتلت ${S.kills}${win?' وكسرت اللعنة ☀️':''} (لعنة ${S.curse}) — جرّبها: https://mohamedelsayed16399-bit.github.io/pharaoh-curse-3d/`;$('end').classList.add('on');$('hud').classList.remove('on')}
function gameOver(){snd(100,1,'sawtooth',.12,.3);end(false)}
function win(){banner('☀️ النصر!');S.state='winning';S.winT=2.2}
function renderShop(){
 $('coins').textContent=SAVE.coins;$('mstats').innerHTML=`أفضل صمود ${Math.floor(SAVE.best/60)}:${String(SAVE.best%60).padStart(2,'0')} · جولات ${SAVE.runs} · انتصارات ${SAVE.wins} · قتلى ${SAVE.kills}`;
 const box=$('shop');box.innerHTML='';for(const s of SHOP){const lv=SAVE.up[s.k]||0,done=lv>=s.max;const d=document.createElement('div');d.className='sh';
  d.innerHTML=`<b>${s.n}</b> ${'★'.repeat(lv)}${'☆'.repeat(s.max-lv)}<br>${s.d}<br>`;const b=document.createElement('button');b.textContent=done?'مكتمل':`🪙 ${s.c[lv]}`;b.disabled=done||SAVE.coins<s.c[lv];
  b.onclick=()=>{SAVE.coins-=s.c[lv];SAVE.up[s.k]=lv+1;persist();renderShop();snd(700,.15,'triangle',.06,1.5)};d.appendChild(b);box.appendChild(d)}}
$('help').innerHTML=touch?'اسحب في الشاشة للحركة · زرار الاندفاع تحت · الأسلحة بتضرب لوحدها':'<span class="k">WASD</span> أو الأسهم للحركة · <span class="k">Space</span> اندفاع · <span class="k">P</span> إيقاف · الأسلحة بتضرب لوحدها';
function renderAch(){$('achs').innerHTML='الإنجازات: '+ACH.map(a=>`<span style="opacity:${SAVE.ach[a[0]]?1:.35};margin:0 6px;white-space:nowrap">${a[1]}</span>`).join(' ')}
const DAYN=Math.floor((Date.now()+2*3600e3)/864e5),DSEED=DAYN*7919+13,TODAY=new Date(Date.now()+2*3600e3).toISOString().slice(0,10);
const MODS=[null,['🐜 يوم الجعارين: أعداء أكتر بـ50%'],['💎 قلب زجاجي: صحة أقل بـ40% وضرر أعلى بـ50%'],['📜 يوم الحكمة: خبرة ×1.5 وأعداء أمتن 30%'],['⚡ يوم العاصفة: كل الأعداء أسرع 20%']];
const DMOD=1+DAYN%4;let DAILY=false;
function renderDaily(){const b=$('daily');const best=SAVE.daily.d===TODAY?SAVE.daily.best:0;b.innerHTML='';const x=document.createElement('button');x.style.cssText='font-size:15px;padding:6px 14px'+(DAILY?';outline:3px solid #fff':'');x.textContent=(DAILY?'✅ ':'')+'🗓 تحدي النهارده (ذهب ×1.5)';x.onclick=()=>{DAILY=!DAILY;renderDaily()};b.appendChild(x);
 const n=document.createElement('div');n.className='sub';n.style.margin='4px';n.textContent=MODS[DMOD][0]+(best?` · أفضل نتيجتك النهارده ${Math.floor(best/60)}:${String(best%60).padStart(2,'0')}`:'');b.appendChild(n)}
function renderMap(){const b=$('maps');b.innerHTML='الخريطة: ';[['1','🏺 المقبرة'],['2','🏜 صحراء العواصف']].forEach(([k,n])=>{const x=document.createElement('button');const lock=k==='2'&&!(SAVE.wins>0);x.style.cssText='font-size:15px;padding:5px 12px;margin:0 3px'+((SAVE.map||1)==k?';outline:3px solid #fff':'');x.textContent=lock?'🔒 '+n+' (اكسب مرة)':n;x.disabled=lock;x.onclick=()=>{SAVE.map=+k;persist();renderMap()};b.appendChild(x)})}
function renderCurse(){renderAch();renderDaily();renderMap();const b=$('curse');b.innerHTML='مستوى اللعنة: ';for(let i=1;i<=3;i++){const x=document.createElement('button');x.style.cssText='font-size:15px;padding:5px 14px;margin:0 3px';x.textContent=i>SAVE.maxCurse?'🔒':'☠'.repeat(i);x.disabled=i>SAVE.maxCurse;if(i===Math.min(SAVE.curse,SAVE.maxCurse))x.style.outline='3px solid #fff';x.onclick=()=>{SAVE.curse=i;persist();renderCurse()};b.appendChild(x)}
 const n=document.createElement('div');n.className='sub';n.style.margin='4px';n.textContent=SAVE.maxCurse<3?'كسّر اللعنة لتفتح مستوى أصعب (ذهب أكتر ×1.5 / ×2)':'أعلى مستوى لعنة مفتوح';b.appendChild(n)}
$('endless').onclick=()=>{$('end').classList.remove('on');$('hud').classList.add('on');S.endless=1;S.state='play';S.nextBoss=S.t+60;S.eb=0;P.inv=3;P.hp=P.mhp;S.winT=0;banner('♾ اللانهائي! زعيم كل 2.5 دقيقة')};
$('share').onclick=()=>{const t=S.shareTxt||'';if(navigator.share){navigator.share({text:t}).catch(()=>{})}else if(navigator.clipboard){navigator.clipboard.writeText(t);$('share').textContent='✅ اتنسخ'}};
function startRun(){SEEDF=DAILY?mul(DSEED):null;newRun();S.daily=DAILY;if(DAILY){S.mod=DMOD;if(DMOD===2){P.mhp*=.6;P.hp=P.mhp;P.dmgM*=1.5}if(DMOD===3)P.xpM*=1.5}else S.mod=0;$('menu').classList.remove('on');$('end').classList.remove('on');$('hud').classList.add('on');$('dash').style.display=touch?'flex':'none';snd(300,.3,'sine',.06,2)}
$('play').onclick=startRun;$('again').onclick=()=>{$('end').classList.remove('on');$('menu').classList.add('on');$('share').textContent='📤 شارك نتيجتك';renderShop();renderCurse()};
function togglePause(){if(!S)return;if(S.state==='play'){S.state='pause';$('pause').classList.add('on')}else if(S.state==='pause'){S.state='play';$('pause').classList.remove('on')}}
$('resume').onclick=togglePause;$('quit').onclick=()=>{$('pause').classList.remove('on');S.state='play';P.hp=0;gameOver()};
addEventListener('keydown',e=>{if(S&&S.state==='level'&&'123'.includes(e.key)){const c=$('cards').children[+e.key-1];if(c)c.click()}const k=e.key.length===1?e.key.toLowerCase():e.key;if(k===' '||k.startsWith('Arrow'))e.preventDefault();if((k==='p'||k==='Escape')&&!keys[k])togglePause();keys[k]=true});
addEventListener('keyup',e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=false});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S&&S.state==='play')togglePause()});
{const joy=$('joy'),knob=joy.firstChild;let id=null,ox=0,oy=0;
 addEventListener('pointerdown',e=>{if(!touch||id!==null||e.target.id==='dash'||!S||S.state!=='play')return;id=e.pointerId;ox=e.clientX;oy=e.clientY;joy.style.display='block';joy.style.left=(ox-60)+'px';joy.style.top=(oy-60)+'px';knob.style.left='35px';knob.style.top='35px'});
 addEventListener('pointermove',e=>{if(e.pointerId!==id)return;let dx=e.clientX-ox,dy=e.clientY-oy;const l=Math.hypot(dx,dy),m=50;if(l>m){dx*=m/l;dy*=m/l}joyV.x=dx/m;joyV.z=dy/m;knob.style.left=(35+dx)+'px';knob.style.top=(35+dy)+'px'});
 const up=e=>{if(e.pointerId!==id)return;id=null;joyV={x:0,z:0};joy.style.display='none'};addEventListener('pointerup',up);addEventListener('pointercancel',up);
 $('dash').addEventListener('pointerdown',e=>{e.stopPropagation();if(S)S.dashReq=true})}
let last=performance.now();
function frame(now){
 requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;
 if(S&&S.state==='winning'){S.winT-=dt;updFx(dt);if(S.winT<=0)end(true)}
 else if(S&&S.state==='play'){step(dt);if(S.state==='play')hud()}
 render()}
function render(){
 if(P&&S&&S.state!=='end'){const sh=S.shake;cam.position.set(P.x+rr(-sh,sh),31+rr(-sh,sh)*.5,P.z+20);cam.lookAt(P.x,0,P.z+1);
  torchLights.forEach((l,i)=>{l.position.set(P.x+Math.cos(i*2.1+S.t*.2)*8,5,P.z+Math.sin(i*2.1)*8);l.intensity=.8+.15*Math.sin(S.t*9+i)});
  updDn(0.016)}
 else{const tt=performance.now()/6000;cam.position.set(Math.cos(tt)*30,18,Math.sin(tt)*30);cam.lookAt(0,0,0)}
 torches.forEach((f,i)=>{f.scale.y=1+.2*Math.sin(performance.now()/90+i)});
 renderer.render(scene,cam)}
renderShop();renderCurse();requestAnimationFrame(frame);
/* ---------- test harness ---------- */
window.__sim=function(sec,opt){if(Q.has('daily'))DAILY=true;startRun();S.auto=true;const log=[];let err=null;
 try{const n=Math.floor(sec*30);for(let i=0;i<n&&S.state!=='end';i++){if(S.state==='winning'){S.winT-=1/30;if(S.winT<=0){end(true);if(Q.has('endless')&&!S.endless){$('endless').onclick();S.auto=true}}continue}step(1/30);if(i%900===0)log.push({t:Math.round(S.t),hp:Math.round(P.hp),lvl:P.lvl,en:enemies.length,kills:S.kills,w:JSON.stringify(P.w)})}}
 catch(e){err=e.stack||String(e)}
 if(S.state!=='end'){S.auto=false;hud()}render();return{evo:JSON.stringify(P.evo),pets:P.pets.length,map:S.map,state:S.state,won:S.won,endless:!!S.endless,eb:S.eb,mod:S.mod,coins:SAVE.coins,t:Math.round(S.t),lvl:P.lvl,kills:S.kills,hp:Math.round(P.hp),en:enemies.length,boss:!!S.bossE,log,err,gems:gems.length,calls:renderer.info.render.calls,tris:renderer.info.render.triangles}};
if(TEST&&Q.get('sim')){window.addEventListener('load',()=>{setTimeout(()=>{let r;try{r=window.__sim(+Q.get('sim'))}catch(e){r={err:String(e.stack)}}const d=document.createElement('pre');d.id='out';d.textContent=JSON.stringify(r);document.body.appendChild(d);document.title='DONE'},300)})}
